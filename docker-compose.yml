services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: adhd
      POSTGRES_PASSWORD: adhd
      POSTGRES_DB: adhd_irection
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adhd -d adhd_irection"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
